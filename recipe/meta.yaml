{% set name = "requests_ntlm" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b29cc2462623dffdf9b88c43e180ccb735b4007228a542220e882c58ae56c668

build:
  number: 0
  skip: True  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - setuptools >=61.0.0
  run:
    - python
    - requests >=2.0.0
    - pyspnego >=0.4.0
    - cryptography >=1.3

test:
  imports:
    - requests_ntlm
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - flask

about:
  home: https://github.com/requests/requests-ntlm
  license: ISC
  license_family: MIT
  license_file: LICENSE
  summary: 'NTLM authentication support for Requests.'
  description: |
    This package allows for HTTP NTLM authentication using the requests library.
  dev_url: https://github.com/requests/requests-ntlm
  doc_url: https://github.com/requests/requests-ntlm/tree/master/docs

extra:
  recipe-maintainers:
    - synapticarbors
